<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Éttermi Ellenőr & Számlamegosztó v1.7.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 1.3rem;
            color: #ffd700;
            letter-spacing: 0.5px;
        }
        .version-tag {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #222;
            color: #888;
        }
        .tab-btn.active {
            background-color: #ffd700;
            color: #121212;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            background-color: #ffd700;
            color: #121212;
            display: inline-block;
            text-align: center;
        }
        .btn-secondary {
            background-color: #333;
            color: #ffd700;
            border: 1px solid #ffd700;
        }
        .btn-success {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
        }
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        input[type=text], input[type=number], select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .item-info { flex: 1; }
        .item-title { font-size: 1rem; font-weight: 500; }
        .item-price { color: #ffd700; font-size: 0.9rem; }
        .item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .total-box {
            background-color: #262626;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            margin-top: 16px;
            border: 1px solid #ffd700;
        }
        .total-price {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 4px;
        }
        .hidden { display: none; }
        .person-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .person-tab {
            background: #2a2a2a;
            color: #aaa;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }
        .person-tab.active {
            background: #ffd700;
            color: #121212;
        }
        .loading {
            text-align: center;
            color: #ffd700;
            padding: 15px;
            font-weight: bold;
        }
        .save-section, .manual-section {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-top: 14px;
            border: 1px dashed #555;
        }

        /* DYNAMIC IMAGE CROPPER & ZOOM CONTAINER */
        .cropper-container {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
            touch-action: none;
            border: 2px solid #ffd700;
        }
        .cropper-img {
            position: absolute;
            transform-origin: 0 0;
            cursor: grab;
        }
        .zoom-instructions {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Költség & Számla Ellenőr</h1>
        <div class="version-tag">Verzió: v1.7.0 (Zoom & Crop)</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btnMode1" onclick="switchMode(1)">1. Átverés Ellenőrző</button>
        <button class="tab-btn" id="btnMode2" onclick="switchMode(2)">2. Baráti Megosztó</button>
    </div>

    <!-- MENTETT ÉTLAPOK -->
    <div class="card">
        <h4 style="color: #ffd700; margin-bottom: 4px;">Mentett étlap megnyitása</h4>
        <select id="savedMenusSelect" onchange="loadSavedMenu()">
            <option value="">-- Válassz a mentett étlapok közül --</option>
        </select>
    </div>

    <!-- 1. MÓD: ÁTVERÉS ELLENŐRZŐ -->
    <div id="mode1Section" class="card">
        <h3 style="margin-bottom: 12px; color: #fff;">Étlap beolvasása</h3>
        
        <div class="file-upload-wrapper">
            <button class="btn">📸 Étlap fotózása</button>
            <input type="file" id="menuPhoto" accept="image/*" capture="environment" onchange="loadPhotoToCropper()">
        </div>

        <!-- NAGYÍTÓ ÉS VÁGÓ FELÜLET (FOTÓZÁS UTÁN JELENIK MEG) -->
        <div id="cropWrapper" class="hidden">
            <div class="zoom-instructions">👉 Használd az ujjad a kép nagyításához és igazításához!</div>
            <div class="cropper-container" id="cropperBox">
                <img id="previewImg" class="cropper-img" src="" alt="Étlap fotó">
            </div>
            <button class="btn btn-success" onclick="processCroppedPhoto()">✓ PIPA – Beolvasás indítása</button>
        </div>
        
        <div id="loadingStatus"></div>

        <div id="itemList1" style="margin-top: 16px;"></div>

        <!-- KÉZI HOZZÁADÁS -->
        <details style="margin-top: 14px;">
            <summary style="cursor: pointer; color: #888; font-size: 0.85rem;">+ Új tétel hozzáadása kézzel</summary>
            <div class="manual-section">
                <input type="text" id="manualName" placeholder="Étel/ital neve" style="margin-bottom:6px;">
                <input type="number" id="manualPrice" placeholder="Ár (Ft)" style="margin-bottom:6px;">
                <button class="btn btn-secondary" style="margin-top:0;" onclick="addManualItem()">Hozzáadás</button>
            </div>
        </details>

        <!-- Mentés szekció -->
        <div id="saveMenuBox" class="save-section hidden">
            <h4 style="color: #fff; margin-bottom: 6px;">Étlap elmentése későbbre</h4>
            <input type="text" id="menuNameInput" placeholder="Étterem neve (pl. Pelikán Csárda)">
            <button class="btn btn-secondary" onclick="saveCurrentMenu()">Étlap Mentése</button>
        </div>

        <div class="total-box">
            <div>Számított Összeg:</div>
            <div class="total-price" id="totalPrice1">0 Ft</div>
        </div>
    </div>

    <!-- 2. MÓD: BARÁTI MEGOSZTÓ -->
    <div id="mode2Section" class="card hidden">
        <h3 style="margin-bottom: 8px; color: #fff;">Barátok megosztott számlája</h3>
        <label>Kik vannak jelen? (Vesszővel elválasztva)</label>
        <input type="text" id="personNames" value="Peti, Kati, Balázs" placeholder="pl. Peti, Kati, Balázs">
        <button class="btn btn-secondary" onclick="initPersons()">Személyek rögzítése</button>

        <div id="splitContainer" class="hidden" style="margin-top: 16px;">
            <div class="person-tabs" id="personTabsContainer"></div>
            <div id="itemList2"></div>
        </div>

        <div class="total-box" style="margin-top: 16px;">
            <div>Összesen / Fejenként:</div>
            <div class="total-price" id="totalPrice2">0 Ft</div>
            <div id="perPersonBreakdown" style="font-size: 0.9rem; color: #aaa; margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        let currentMode = 1;
        let items = [];
        let persons = ["Peti", "Kati", "Balázs"];
        let activePerson = "Peti";

        // KÉPNAGYÍTÁS ÉS HÚZÁS VÁLTOZÓK
        let imgScale = 1;
        let imgX = 0;
        let imgY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let initialDistance = null;

        window.onload = function() {
            refreshSavedMenusList();
            renderList1();
            setupTouchZoom();
        };

        function switchMode(m) {
            currentMode = m;
            if(m === 1) {
                document.getElementById('btnMode1').classList.add('active');
                document.getElementById('btnMode2').classList.remove('active');
                document.getElementById('mode1Section').classList.remove('hidden');
                document.getElementById('mode2Section').classList.add('hidden');
                renderList1();
            } else {
                document.getElementById('btnMode2').classList.add('active');
                document.getElementById('btnMode1').classList.remove('active');
                document.getElementById('mode2Section').classList.remove('hidden');
                document.getElementById('mode1Section').classList.add('hidden');
                initPersons();
            }
        }

        // FOTÓ BETÖLTÉSE A NAGYÍTÓS / VÁGÓS SZERKESZTŐBE
        function loadPhotoToCropper() {
            const fileInput = document.getElementById('menuPhoto');
            if (!fileInput.files || fileInput.files.length === 0) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('previewImg');
                img.src = e.target.result;
                img.onload = function() {
                    imgScale = 1;
                    imgX = 0;
                    imgY = 0;
                    updateImgTransform();
                    document.getElementById('cropWrapper').classList.remove('hidden');
                };
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function updateImgTransform() {
            const img = document.getElementById('previewImg');
            img.style.transform = `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
        }

        // ERINTÉSES NAGYÍTÁS ÉS MOZGATÁS (TOUCH EVENTS)
        function setupTouchZoom() {
            const box = document.getElementById('cropperBox');
            const img = document.getElementById('previewImg');

            box.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - imgX;
                    startY = e.touches[0].clientY - imgY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            });

            box.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    imgX = e.touches[0].clientX - startX;
                    imgY = e.touches[0].clientY - startY;
                    updateImgTransform();
                } else if (e.touches.length === 2 && initialDistance) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let factor = dist / initialDistance;
                    imgScale = Math.min(Math.max(1, imgScale * factor), 4);
                    initialDistance = dist;
                    updateImgTransform();
                }
            });

            box.addEventListener('touchend', () => {
                isDragging = false;
                initialDistance = null;
            });
        }

        // RÁNAGYÍTOTT KÉPRÉSZLET KIVÁGÁSA ÉS AI-VAL BEOLVASÁSA
        async function processCroppedPhoto() {
            const statusDiv = document.getElementById('loadingStatus');
            const img = document.getElementById('previewImg');
            
            statusDiv.innerHTML = '<div class="loading">🔍 Ránagyított felület beolvasása...</div>';

            const canvas = document.createElement('canvas');
            const box = document.getElementById('cropperBox');
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(imgX, imgY);
            ctx.scale(imgScale, imgScale);
            ctx.drawImage(img, 0, 0);
            ctx.restore();

            const base64Image = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "SZIGORÚ UTASÍTÁS: Olvasd ki erről a kivágott/ránagyított képről az összes látható ételt, italt és árat! Add vissza tiszta JSON tömbként: [{\"name\":\"Tétel neve\",\"price\":1200}]. Csak a JSON-t!" },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data && data.candidates && data.candidates[0].content.parts[0].text) {
                    let textResult = data.candidates[0].content.parts[0].text;
                    textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                    let parsedItems = JSON.parse(textResult);

                    if (Array.isArray(parsedItems) && parsedItems.length > 0) {
                        items = parsedItems.map((item, index) => ({
                            id: Date.now() + index,
                            name: item.name || "Tétel",
                            price: Number(item.price) || 0,
                            qty1: 0,
                            qtyPerPerson: {}
                        }));
                        statusDiv.innerHTML = '<div style="color: #4caf50; text-align:center; margin: 10px 0;">Sikeres beolvasás a rángyított képről!</div>';
                        document.getElementById('cropWrapper').classList.add('hidden');
                    } else {
                        throw new Error("Nem sikerült elolvasni a kiemelt részt.");
                    }
                } else {
                    throw new Error("Szerver válaszhiba.");
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = '<div style="color: #ff6666; text-align:center; margin: 10px 0;">Nem sikerült kiolvasni a ráilletsztett képet. Nagyíts közelebb az árakhoz!</div>';
            }

            if (items.length > 0) {
                document.getElementById('saveMenuBox').classList.remove('hidden');
            }
            renderList1();
            if(currentMode === 2) renderList2();
        }

        function addManualItem() {
            let name = document.getElementById('manualName').value.trim();
            let price = Number(document.getElementById('manualPrice').value);

            if(!name || !price) {
                alert("Kérlek add meg a nevet és az árat is!");
                return;
            }

            items.push({
                id: Date.now(),
                name: name,
                price: price,
                qty1: 0,
                qtyPerPerson: {}
            });

            document.getElementById('manualName').value = '';
            document.
