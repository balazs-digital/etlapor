<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Éttermi Ellenőr & Számlamegosztó v1.9.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 1.3rem;
            color: #ffd700;
            letter-spacing: 0.5px;
        }
        .version-tag {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #222;
            color: #888;
        }
        .tab-btn.active {
            background-color: #ffd700;
            color: #121212;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            background-color: #ffd700;
            color: #121212;
            display: inline-block;
            text-align: center;
        }
        .btn-secondary {
            background-color: #333;
            color: #ffd700;
            border: 1px solid #ffd700;
        }
        .btn-success {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            font-size: 1.1rem;
        }
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        input[type=text], input[type=number], select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .item-info { flex: 1; }
        .item-title { font-size: 1rem; font-weight: 500; }
        .item-price { color: #ffd700; font-size: 0.9rem; }
        .item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .total-box {
            background-color: #262626;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            margin-top: 16px;
            border: 1px solid #ffd700;
        }
        .total-price {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 4px;
        }
        .hidden { display: none; }
        .person-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .person-tab {
            background: #2a2a2a;
            color: #aaa;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }
        .person-tab.active {
            background: #ffd700;
            color: #121212;
        }
        .loading {
            text-align: center;
            color: #ffd700;
            padding: 15px;
            font-weight: bold;
        }
        .save-section, .manual-section {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-top: 14px;
            border: 1px dashed #555;
        }

        /* ZOOM & CROP FELÜLET */
        .zoom-wrapper {
            background-color: #000;
            border-radius: 10px;
            border: 2px solid #ffd700;
            margin-top: 12px;
            padding: 8px;
            text-align: center;
        }
        canvas#zoomCanvas {
            width: 100%;
            max-height: 320px;
            background-color: #000;
            border-radius: 6px;
            touch-action: none;
            display: block;
            cursor: grab;
        }
        .zoom-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .zoom-btn {
            flex: 1;
            padding: 10px;
            background-color: #333;
            color: #ffd700;
            border: 1px solid #ffd700;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Költség & Számla Ellenőr</h1>
        <div class="version-tag">Verzió: v1.9.0</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btnMode1" onclick="switchMode(1)">1. Átverés Ellenőrző</button>
        <button class="tab-btn" id="btnMode2" onclick="switchMode(2)">2. Baráti Megosztó</button>
    </div>

    <!-- MENTETT ÉTLAPOK -->
    <div class="card">
        <h4 style="color: #ffd700; margin-bottom: 4px;">Mentett étlap megnyitása</h4>
        <select id="savedMenusSelect" onchange="loadSavedMenu()">
            <option value="">-- Válassz a mentett étlapok közül --</option>
        </select>
    </div>

    <!-- 1. MÓD: ÁTVERÉS ELLENŐRZŐ -->
    <div id="mode1Section" class="card">
        <h3 style="margin-bottom: 12px; color: #fff;">Étlap beolvasása</h3>
        
        <div class="file-upload-wrapper">
            <button class="btn">📸 Étlap fotózása</button>
            <input type="file" id="menuPhoto" accept="image/*" capture="environment" onchange="loadPhotoToCanvas()">
        </div>

        <!-- NAGYÍTÓ ÉS MOZGATÓ DOBOZ -->
        <div id="cropWrapper" class="zoom-wrapper hidden">
            <div style="font-size:0.8rem; color:#aaa; margin-bottom:6px;">👉 Húzd a képet az ujjaddal, vagy nagyíts a gombokkal:</div>
            <canvas id="zoomCanvas"></canvas>
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="adjustZoom(1.25)">🔍 + Nagyítás</button>
                <button class="zoom-btn" onclick="adjustZoom(0.8)">🔍 - Kicsinyítés</button>
                <button class="zoom-btn" onclick="resetZoom()">🔄 Alaphelyzet</button>
            </div>
            <button class="btn btn-success" style="margin-top:10px;" onclick="processCanvasImage()">✓ BEOLVASÁS INDÍTÁSA</button>
        </div>
        
        <div id="loadingStatus"></div>

        <div id="itemList1" style="margin-top: 16px;"></div>

        <!-- KÉZI HOZZÁADÁS (BIZTOSÍTÉK) -->
        <details style="margin-top: 14px;">
            <summary style="cursor: pointer; color: #888; font-size: 0.85rem;">+ Új tétel hozzáadása kézzel</summary>
            <div class="manual-section">
                <input type="text" id="manualName" placeholder="Étel/ital neve" style="margin-bottom:6px;">
                <input type="number" id="manualPrice" placeholder="Ár (Ft)" style="margin-bottom:6px;">
                <button class="btn btn-secondary" style="margin-top:0;" onclick="addManualItem()">Hozzáadás</button>
            </div>
        </details>

        <!-- Mentés szekció -->
        <div id="saveMenuBox" class="save-section hidden">
            <h4 style="color: #fff; margin-bottom: 6px;">Étlap elmentése későbbre</h4>
            <input type="text" id="menuNameInput" placeholder="Étterem neve (pl. Pelikán Csárda)">
            <button class="btn btn-secondary" onclick="saveCurrentMenu()">Étlap Mentése</button>
        </div>

        <div class="total-box">
            <div>Számított Összeg:</div>
            <div class="total-price" id="totalPrice1">0 Ft</div>
        </div>
    </div>

    <!-- 2. MÓD: BARÁTI MEGOSZTÓ -->
    <div id="mode2Section" class="card hidden">
        <h3 style="margin-bottom: 8px; color: #fff;">Barátok megosztott számlája</h3>
        <label>Kik vannak jelen? (Vesszővel elválasztva)</label>
        <input type="text" id="personNames" value="Peti, Kati, Balázs" placeholder="pl. Peti, Kati, Balázs">
        <button class="btn btn-secondary" onclick="initPersons()">Személyek rögzítése</button>

        <div id="splitContainer" class="hidden" style="margin-top: 16px;">
            <div class="person-tabs" id="personTabsContainer"></div>
            <div id="itemList2"></div>
        </div>

        <div class="total-box" style="margin-top: 16px;">
            <div>Összesen / Fejenként:</div>
            <div class="total-price" id="totalPrice2">0 Ft</div>
            <div id="perPersonBreakdown" style="font-size: 0.9rem; color: #aaa; margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        let currentMode = 1;
        let items = [];
        let persons = ["Peti", "Kati", "Balázs"];
        let activePerson = "Peti";

        let loadedImg = new Image();
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        window.onload = function() {
            refreshSavedMenusList();
            renderList1();
            initCanvasEvents();
        };

        function switchMode(m) {
            currentMode = m;
            if(m === 1) {
                document.getElementById('btnMode1').classList.add('active');
                document.getElementById('btnMode2').classList.remove('active');
                document.getElementById('mode1Section').classList.remove('hidden');
                document.getElementById('mode2Section').classList.add('hidden');
                renderList1();
            } else {
                document.getElementById('btnMode2').classList.add('active');
                document.getElementById('btnMode1').classList.remove('active');
                document.getElementById('mode2Section').classList.remove('hidden');
                document.getElementById('mode1Section').classList.add('hidden');
                initPersons();
            }
        }

        function loadPhotoToCanvas() {
            const fileInput = document.getElementById('menuPhoto');
            if (!fileInput.files || fileInput.files.length === 0) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                loadedImg = new Image();
                loadedImg.onload = function() {
                    scale = 1;
                    offsetX = 0;
                    offsetY = 0;
                    document.getElementById('cropWrapper').classList.remove('hidden');
                    drawCanvas();
                };
                loadedImg.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function drawCanvas() {
            const canvas = document.getElementById('zoomCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = canvas.clientWidth;
            canvas.height = 300;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
            ctx.scale(scale, scale);

            let drawW = canvas.width;
            let drawH = (loadedImg.height / loadedImg.width) * drawW;
            ctx.drawImage(loadedImg, -drawW / 2, -drawH / 2, drawW, drawH);

            ctx.restore();
        }

        function adjustZoom(factor) {
            scale *= factor;
            scale = Math.min(Math.max(0.5, scale), 6);
            drawCanvas();
        }

        function resetZoom() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            drawCanvas();
        }

        function initCanvasEvents() {
            const canvas = document.getElementById('zoomCanvas');

            // Érintéses (mobil) mozgás
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - offsetX;
                    startY = e.touches[0].clientY - offsetY;
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    offsetX = e.touches[0].clientX - startX;
                    offsetY = e.touches[0].clientY - startY;
                    drawCanvas();
                }
            });

            canvas.addEventListener('touchend', () => { isDragging = false; });

            // Egérrel történő mozgás (ha gépen teszteli)
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    offsetX = e.clientX - startX;
                    offsetY = e.clientY - startY;
                    drawCanvas();
                }
            });

            canvas.addEventListener('mouseup', () => { isDragging = false; });
            canvas.addEventListener('mouseleave', () => { isDragging = false; });
        }

        async function processCanvasImage() {
            const statusDiv = document.getElementById('loadingStatus');
            const canvas = document.getElementById('zoomCanvas');

            statusDiv.innerHTML = '<div class="loading">🔍 Kép elemzése és AI feldolgozás...</div>';

            const base64Image = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "SZIGORÚ UTASÍTÁS: Olvasd ki erről a kivágott/ránagyított képről az összes látható ételt, italt és árat! Add vissza tiszta JSON tömbként: [{\"name\":\"Tétel neve\",\"price\":1200}]. Semmi más szöveget ne írj!" },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data && data.candidates && data.candidates[0].content.parts[0].text) {
                    let textResult = data.candidates[0].content.parts[0].text;
                    textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                    let parsedItems = JSON.parse(textResult);

                    if (Array.isArray(parsedItems) && parsedItems.length > 0) {
                        items = parsedItems.map((item, index) => ({
                            id: Date.now() + index,
                            name: item.name || "Tétel",
                            price: Number(item.price) || 0,
                            qty1: 0,
                            qtyPerPerson: {}
                        }));
                        statusDiv.innerHTML = '<div style="color: #4caf50; text-align:center; margin: 10px 0;">Sikeresen beolvasva!</div>';
                        document.getElementById('cropWrapper').classList.add('hidden');
                    } else {
                        throw new Error("Nem találhatók tételek a képen.");
                    }
                } else {
                    throw new Error("Érvénytelen válasz a szervertől.");
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = '<div style="color: #ff6666; text-align:center; margin: 10px 0;">Nem sikerült kiolvasni. Nagyíts közelebb a gombokkal, vagy használd alul a kézi rögzítést!</div>';
            }

            if (items.length > 0) {
                document.getElementById('saveMenuBox').classList.remove('hidden');
            }
            renderList1();
            if(currentMode === 2) renderList2();
        }

        function addManualItem() {
            let name = document.getElementById('manualName').value.trim();
            let price = Number(document.getElementById('manualPrice').value);

            if(!name || !price) {
                alert("Kérlek add meg a nevet és az árat is!");
                return;
            }

            items.push({
                id: Date.now(),
                name: name,
                price: price,
                qty1: 0,
                qtyPerPerson: {}
            });

            document.getElementById('manualName').value = '';
            document.getElementById('manualPrice').value = '';
            document.getElementById('saveMenuBox').classList.remove('hidden');
            renderList1();
            if(currentMode === 2) renderList2();
        }

        function saveCurrentMenu() {
            const nameInput = document.getElementById('menuNameInput').value.trim();
            if (!nameInput) {
                alert("Kérlek adj meg egy nevet az étlapnak!");
                return;
            }
            if (items.length === 0) {
                alert("Nincs menthető étlap!");
                return;
            }

            let savedMenus = JSON.parse(localStorage.getItem('saved_restaurant_menus') || '{}');
            savedMenus[nameInput] = items.map(i => ({ name: i.name, price: i.price }));
            localStorage.setItem('saved_restaurant_menus', JSON.stringify(savedMenus));

            alert(`'${nameInput}' sikeresen elmentve!`);
            document.getElementById('menuNameInput').value = '';
            refreshSavedMenusList();
        }

        function refreshSavedMenusList() {
            const select = document.getElementById('savedMenusSelect');
            select.innerHTML = '<option value="">-- Válassz a mentett étlapok közül --</option>';

            let savedMenus = JSON.parse(localStorage.getItem('saved_restaurant_menus') || '{}');
            for (let name in savedMenus) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            }
        }

        function loadSavedMenu() {
            const select = document.getElementById('savedMenusSelect');
            const selectedName = select.value;
            if (!selectedName) return;

            let savedMenus = JSON.parse(localStorage.getItem('saved_restaurant_menus') || '{}');
            let loadedItems = savedMenus[selectedName];

            if (loadedItems) {
                items = loadedItems.map((item, index) => ({
                    id: Date.now() + index,
                    name: item.name,
                    price: Number(item.price),
                    qty1: 0,
                    qtyPerPerson: {}
                }));

                document.getElementById('saveMenuBox').classList.remove('hidden');
                document.getElementById('loadingStatus').innerHTML = `<div style="color: #ffd700; text-align:center; margin: 10px 0;">Betöltve: <b>${selectedName}</b></div>`;
                renderList1();
                if(currentMode === 2) renderList2();
            }
        }

        function renderList1() {
            let container = document.getElementById('itemList1');
            if(items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">Még nincsenek tételek. Fotózd be az étlapot a gombra kattintva!</p>';
                return;
            }
            let html = '';
            items.forEach(i => {
                html += `<div class="item-row">
                    <div class="item-info">
                        <div class="item-title">${i.name}</div>
                        <div class="item-price">${i.price} Ft / db</div>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty1(${i.id}, -1)">-</button>
                        <span style="font-weight:bold; width:24px; text-align:center;">${i.qty1}</span>
                        <button class="qty-btn" onclick="changeQty1(${i.id}, 1)">+</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            calcTotal1();
        }

        function changeQty1(id, delta) {
            let item = items.find(x => x.id === id);
            if(item) {
                item.qty1 = Math.max(0, item.qty1 + delta);
                renderList1();
            }
        }

        function calcTotal1() {
            let sum = items.reduce((acc, curr) => acc + (curr.qty1 * curr.price), 0);
            document.getElementById('totalPrice1').innerText = sum.toLocaleString() + " Ft";
        }

        function initPersons() {
            let val = document.getElementById('personNames').value;
            persons = val.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if(persons.length === 0) persons = ["Vendég 1"];
            activePerson = persons[0];

            document.getElementById('splitContainer').classList.remove('hidden');
            renderPersonTabs();
            renderList2();
        }

        function renderPersonTabs() {
            let html = '';
            persons.forEach(p => {
                html += `<button class="person-tab ${p === activePerson ? 'active' : ''}" onclick="selectPerson('${p}')">${p}</button>`;
            });
            document.getElementById('personTabsContainer').innerHTML = html;
        }

        function selectPerson(p) {
            activePerson = p;
            renderPersonTabs();
            renderList2();
        }

        function renderList2() {
            let container = document.getElementById('itemList2');
            if(items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">Előbb fotózz be egy étlapot az 1. módban!</p>';
                return;
            }
            let html = '';
            items.forEach(i => {
                let q = (i.qtyPerPerson[activePerson] || 0);
                html += `<div class="item-row">
                    <div class="item-info">
                        <div class="item-title">${i.name} (${activePerson}-nek)</div>
                        <div class="item-price">${i.price} Ft / db</div>
                    </div>
                    <div class="item-controls">
                        <button class="qty-btn" onclick="changeQty2(${i.id}, -1)">-</button>
                        <span style="font-weight:bold; width:24px; text-align:center;">${q}</span>
                        <button class="qty-btn" onclick="changeQty2(${i.id}, 1)">+</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            calcTotal2();
        }

        function changeQty2(id, delta) {
            let item = items.find(x => x.id === id);
            if(item) {
                if(!item.qtyPerPerson[activePerson]) item.qtyPerPerson[activePerson] = 0;
                item.qtyPerPerson[activePerson] = Math.max(0, item.qtyPerPerson[activePerson] + delta);
                renderList2();
            }
        }

        function calcTotal2() {
            let totalSum = 0;
            let personTotals = {};
            persons.forEach(p => personTotals[p] = 0);

            items.forEach(i => {
                persons.forEach(p => {
                    let q = (i.qtyPerPerson[p] || 0);
                    let sub = q * i.price;
                    personTotals[p] += sub;
                    totalSum += sub;
                });
            });

            document.getElementById('totalPrice2').innerText = totalSum.toLocaleString() + " Ft";

            let breakdownText = "";
            persons.forEach(p => {
                breakdownText += `${p}: ${personTotals[p].toLocaleString()} Ft | `;
            });
            document.getElementById('perPersonBreakdown').innerText = breakdownText;
        }
    </script>
</body>
</html>
